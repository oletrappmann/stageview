# videos.stagecraft.media: Videoseiten für Kunden (seit 12.11.2026)
# Videos laufen über Mux, Original und Download bleiben in Google Drive.
# Pro Kunde und pro Content Day ein Ordner /<code>/ (Code ersetzt das Passwort), Link nur /<code>. Alles andere 404.
# Dateien: /var/www/videos (hermes:www-data), gebaut von STAGECRAFT_VIDEOPLAYER/portal/daten.py
server {
    server_name videos.stagecraft.media;
    access_log off;
    root /var/www/videos;
    autoindex off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Linkvorschauen (seit 13.11.2026): Vorschau Dienste dürfen lesen, Suchmaschinen nicht (dazu noindex Kopfzeile)
    location = /robots.txt { default_type text/plain; return 200 "User-agent: facebookexternalhit\nAllow: /\n\nUser-agent: Facebot\nAllow: /\n\nUser-agent: WhatsApp\nAllow: /\n\nUser-agent: Twitterbot\nAllow: /\n\nUser-agent: Slackbot-LinkExpanding\nAllow: /\n\nUser-agent: LinkedInBot\nAllow: /\n\nUser-agent: TelegramBot\nAllow: /\n\nUser-agent: Discordbot\nAllow: /\n\nUser-agent: *\nDisallow: /\n"; }
    location = /logo.svg { expires 7d; }
    location = /vorschau-stagecraft.png { expires 7d; }
    location ~ "^/(icon\.svg|icon-32\.png|apple-touch-icon\.png|favicon\.ico)$" { expires 7d; try_files $uri =404; }
    # Kurze Links (seit 13.11.2026): /<code> ist die Seite, /<code>/<nr> ein Video (dieselbe index.html, die Seite sucht das Video selbst aus)
    location ~ "^/([a-z0-9]{6})/(videos|projekt)\.json$" { expires -1; try_files $uri =404; }
    # /<code>/<nr> hat eine eigene index.html mit der Linkvorschau des Videos, sonst die Projektseite
    location ~ "^/([a-z0-9]{6})(/[a-z0-9-]+)?/?$" { expires -1; try_files /$1$2/index.html /$1/index.html =404; }
    # Alte lange Links /<name>-<code>/... leiten auf die kurzen um
    location ~ "^/[a-z0-9-]+-([a-z0-9]{6})(/[a-z0-9-]*)?/?$" { return 301 /$1$2$is_args$args; }
    # Admin Dashboard fuer das Team (seit 14.11.2026): feste Seite ohne Daten, gebaut von stageview, Daten nur mit Anmeldung ueber /api/admin/
    location = /admin { expires -1; try_files /admin/index.html =404; }
    location = /admin/ { return 301 /admin; }
    # Kommentare und Status: Dienst videos-api (hermes, 127.0.0.1:8652)
    location ^~ /api/ {
        limit_req zone=videos_api burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8652;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
    }
    location / { return 404; }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/videos.stagecraft.media/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/videos.stagecraft.media/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = videos.stagecraft.media) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name videos.stagecraft.media;
    return 404; # managed by Certbot


}